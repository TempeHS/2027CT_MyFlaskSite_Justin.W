{% extends "base.html" %} {% block title %}Sign Up{% endblock %} {% block
content %}
<div class="container mt-5" style="max-width: 600px">
  <h1 class="mb-4">Login to Account</h1>
  <p>※Note: This feature does not authenticate at this stage</p>
  {% if error %}
  <div class="alert alert-danger" role="alert">{{ error }}</div>
  {% endif %}

  <form method="POST" action="{{ url_for('login') }}">
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input type="text" name="name" class="form-control" required />
    </div>

    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" required />
    </div>

    <button type="submit" class="btn btn-primary w-100 mb-5">Login</button>
  </form>
    
  <div class="col-md-12">
      <a href="{{ url_for('signup') }}" class="btn btn-primary w-100"
        >Doesn't have an account? Click here to Sign Up!</a
      >
    </div>
</div>
{% endblock %}
